name: Buddy pings

# Hits the /api/nudge endpoint every hour. The endpoint itself decides, per user and per their
# local time, whether to actually send one of their ~N daily pings — so hourly is just the tick.
on:
  schedule:
    - cron: '0 * * * *' # top of every hour (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nudge endpoint
        env:
          NUDGE_URL: ${{ secrets.NUDGE_URL }}
          NUDGE_SECRET: ${{ secrets.NUDGE_SECRET }}
        run: |
          # Not configured yet? Skip cleanly (no failure email). Add the NUDGE_URL and
          # NUDGE_SECRET repo secrets to switch buddy pings on.
          if [ -z "$NUDGE_URL" ] || [ -z "$NUDGE_SECRET" ]; then
            echo "NUDGE_URL / NUDGE_SECRET not set — skipping. Add repo secrets to enable buddy pings."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST "$NUDGE_URL" \
            -H "x-nudge-secret: $NUDGE_SECRET")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
